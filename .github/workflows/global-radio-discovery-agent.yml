name: WaveAtlas Background Agents

on:
  workflow_dispatch:
    inputs:
      agent:
        description: Agent to run
        type: choice
        options: [all, both, stream-health, station-discovery, operations]
        default: all
      dry_run:
        description: Produce reports without proposing catalog changes
        type: boolean
        default: true
  schedule:
    - cron: '17 4 * * *'
    - cron: '43 */8 * * *'
    - cron: '29 */8 * * *'
  pull_request:
    paths: ['lib/**', 'scripts/**', 'tests/**', 'app/api/agents/**', 'app/api/brief/**', 'components/WaveAtlasApp.tsx', 'components/NewspaperBrief.tsx', 'components/NewspaperHeadline.tsx', 'package*.json', '.github/workflows/global-radio-discovery-agent.yml']
  push:
    branches: [main]
    paths: ['lib/**', 'scripts/**', 'tests/**', 'app/api/agents/**', 'app/api/brief/**', 'components/WaveAtlasApp.tsx', 'components/NewspaperBrief.tsx', 'components/NewspaperHeadline.tsx', 'package*.json', '.github/workflows/global-radio-discovery-agent.yml']

permissions:
  contents: read
concurrency:
  group: waveatlas-agents-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:agents
      - run: npm run test:operations
      - run: npm run test:brief
      - run: npm run test:media-session
      - run: npm run radio:validate
      - run: npm run typecheck
      - run: npm run build

  health:
    if: (github.event_name == 'schedule' && github.event.schedule != '29 */8 * * *') || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","both","stream-health"]'), inputs.agent)) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[agents-bootstrap]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check a rotating catalog batch
        run: npm run radio:health
        env:
          STATION_HEALTH_LIMIT: '120'
          STATION_HEALTH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      - run: npm run test:agents
      - run: npm run test:operations
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: station-health-report
          path: reports/station-health-report.*
          retention-days: 14
      - name: Publish health review branch
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: bash scripts/publish-agent-report.sh chore/waveatlas-stream-health-agent lib/stations/stationHealthSnapshot.json reports/station-health-report.json reports/station-health-report.md

  discover:
    if: (github.event_name == 'schedule' && github.event.schedule == '17 4 * * *') || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","both","station-discovery"]'), inputs.agent)) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[agents-bootstrap]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Discover and sample verified audio streams
        run: npm run radio:discover
        env:
          RADIO_DISCOVERY_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          RADIO_DISCOVERY_MAX_ADD: '40'
          RADIO_DISCOVERY_MAX_PROBES: '80'
          RADIO_DISCOVERY_COUNTRIES_PER_RUN: '12'
          RADIO_DISCOVERY_MIN_BITRATE: '64'
          RADIO_DISCOVERY_REQUIRE_GEO: 'false'
      - run: npm run radio:validate
      - run: npm run test:agents
      - run: npm run test:operations
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radio-discovery-report
          path: reports/radio-discovery-report.*
          retention-days: 14
      - name: Publish discovery review branch
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: bash scripts/publish-agent-report.sh chore/global-radio-discovery-agent lib/stations/discoveredRadioStations.ts lib/stations/discoveredRadioMetadata.json reports/radio-discovery-report.json reports/radio-discovery-report.md

  operations:
    if: (github.event_name == 'schedule' && github.event.schedule == '29 */8 * * *') || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","both","operations"]'), inputs.agent)) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[agents-bootstrap]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:operations
      - run: npm run agents:operate
        env:
          OPERATIONAL_AGENTS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      - run: npm run typecheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-agents-report
          path: reports/operational-agents.*
          retention-days: 30
      - name: Publish operational review branch
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: bash scripts/publish-agent-report.sh chore/waveatlas-operational-agents lib/agents/operational-status.json reports/operational-agents.json reports/operational-agents.md
