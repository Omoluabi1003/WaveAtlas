name: WaveAtlas Background Agents

on:
  workflow_dispatch:
    inputs:
      agent:
        description: Agent to run
        type: choice
        options: [all, both, stream-health, station-discovery, operations]
        default: all
      dry_run:
        description: Produce reports without proposing catalog changes
        type: boolean
        default: true
  schedule:
    - cron: '17 */8 * * *'
    - cron: '43 */8 * * *'
    - cron: '29 */8 * * *'
  pull_request:
    paths: ['lib/**', 'scripts/**', 'tests/**', 'app/api/agents/**', 'app/api/brief/**', 'components/WaveAtlasApp.tsx', 'components/ButtonFeedback.tsx', 'app/layout.tsx', 'app/globals.css', 'components/NewspaperBrief.tsx', 'components/NewspaperHeadline.tsx', 'package*.json', '.github/workflows/global-radio-discovery-agent.yml']
  push:
    branches: [main]
    paths: ['lib/**', 'scripts/**', 'tests/**', 'app/api/agents/**', 'app/api/brief/**', 'components/WaveAtlasApp.tsx', 'components/ButtonFeedback.tsx', 'app/layout.tsx', 'app/globals.css', 'components/NewspaperBrief.tsx', 'components/NewspaperHeadline.tsx', 'package*.json', '.github/workflows/global-radio-discovery-agent.yml']

permissions:
  contents: read
concurrency:
  group: waveatlas-agents-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:queen
      - run: npm run test:agents
      - run: npm run test:operations
      - run: npm run test:brief
      - run: npm run test:media-session
      - run: npm run test:button-feedback
      - run: npm run radio:validate
      - run: npm run typecheck
      - run: npm run build

  queen:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[agents-bootstrap]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:queen
      - name: Restore shared execution memory
        run: |
          if git ls-remote --exit-code --heads origin chore/waveatlas-queen-memory; then
            git fetch origin chore/waveatlas-queen-memory
            mkdir -p reports
            git show FETCH_HEAD:reports/queen-memory.json > reports/queen-memory.json
          fi
      - name: Coordinate existing workers without paid model calls
        id: coordinate
        run: npm run agents:queen
        env:
          QUEEN_AGENT: ${{ inputs.agent || 'all' }}
          QUEEN_SCHEDULE: ${{ github.event.schedule }}
          QUEEN_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          STATION_HEALTH_LIMIT: '120'
          RADIO_DISCOVERY_MAX_ADD: '50'
          RADIO_DISCOVERY_MAX_PROBES: '150'
          RADIO_DISCOVERY_COUNTRIES_PER_RUN: '24'
          RADIO_DISCOVERY_MIN_BITRATE: '0'
          RADIO_DISCOVERY_REQUIRE_GEO: 'false'
      - name: Save execution memory even when a worker fails
        if: always() && steps.coordinate.outcome != 'skipped'
        run: |
          if test -f reports/queen-memory.json; then
            bash scripts/publish-agent-report.sh chore/waveatlas-queen-memory reports/queen-memory.json
          fi
      - run: npm run test:agents
      - run: npm run test:operations
      - run: npm run radio:validate
      - run: npm run typecheck
      - run: npm run build
      - name: Publish validated changes for review
        if: success() && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
        run: |
          paths=(reports/queen-report.json)
          for file in lib/stations/stationHealthSnapshot.json lib/stations/discoveredRadioStations.ts lib/stations/discoveredRadioMetadata.json lib/agents/operational-status.json reports/station-health-report.json reports/station-health-report.md reports/radio-discovery-report.json reports/radio-discovery-report.md reports/operational-agents.json reports/operational-agents.md; do
            if test -f "$file"; then paths+=("$file"); fi
          done
          bash scripts/publish-agent-report.sh chore/waveatlas-queen-reports "${paths[@]}"
