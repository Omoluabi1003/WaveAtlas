name: Apply Atlas v3 integration patch
on:
  push:
    branches: [feature/atlas-intelligence-voice-v3]
    paths:
      - scripts/apply-atlas-v3-patch.mjs
      - .github/workflows/apply-atlas-v3-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atlas-intelligence-voice-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-atlas-v3-patch.mjs
      - name: Commit exact integration patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/AtlasAssistant.tsx public/atlas-voice-clone.html
          git commit -m "Integrate Omoluabi Paul with production Atlas voice" || exit 0
          git push origin HEAD:feature/atlas-intelligence-voice-v3
